[build]
  command = "npm run build"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.164.0"
  NODE_VERSION = "24"

# Without an overridden baseURL, absolute links on a preview point back at the
# production site rather than at the deploy being reviewed.
[context.deploy-preview]
  command = "npm run build:ts && npm run build:scss && hugo --baseURL $DEPLOY_PRIME_URL"

[context.branch-deploy]
  command = "npm run build:ts && npm run build:scss && hugo --baseURL $DEPLOY_PRIME_URL"
