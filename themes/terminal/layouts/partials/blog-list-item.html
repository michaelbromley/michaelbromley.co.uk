<li class="post-list-row">
    <div class="post-list-meta">
        <time class="date" datetime='{{ .Date.Format "2006-01-02T15:04:05.000-07:00" }}' itemprop="datePublished">{{ .Date.Format "02 Jan 2006" }}</time>
    </div>
    <div class="post-list-entry">
        <h2><a class="post-list-title" href="{{ .RelPermalink }}">{{ .Title }}</a></h2>

        <div class="post-meta">
            <span class="reading-time">{{ .ReadingTime }} min read</span>
            {{ partial "tag-list.html" .Params.tags }}
        </div>

        <div class="post-list-excerpt">
            {{ .Summary | plainify | truncate 280 }}
            <a class="post-list-more" href="{{ .RelPermalink }}">read more &rsaquo;</a>
        </div>
    </div>
</li>
