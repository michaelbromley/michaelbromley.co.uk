<!DOCTYPE html>
<html lang="en">
<head>
    <title>{{ if and .Title (ne .Title .Site.Title) }}{{ .Title }} // {{ .Site.Title }}{{ else }}{{ .Site.Title }}{{ end }}</title>

    {{ partial "meta.html" . }}
    {{ partial "og.html" . }}

    {{ with .OutputFormats.Get "rss" -}}
    <link href="{{ .Permalink }}" rel="alternate" type="application/rss+xml" title="{{ $.Site.Title }}" />
    {{- end }}
    <link rel="shortcut icon" href="/favicon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:400,700|Fira+Mono&display=swap" rel="stylesheet">

    {{/* relURL, not BaseURL: assets must come from whichever host is serving the page,
         otherwise deploy previews load production's CSS and JS instead of their own. */}}
    <link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
    <script defer src="{{ "js/script.js" | relURL }}"></script>

    {{ hugo.Generator }}
</head>
