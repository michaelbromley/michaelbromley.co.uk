{{ partial "head.html" . }}
<body>
<div id="container">
    {{ partial "main-nav.html" . }}
    <section id="main" class="outer">
        <h1 class="page-header" data-type-effect>{{ .Title }}</h1>
        <ul class="term-cloud">
            {{ range .Data.Terms.Alphabetical }}
            <li>
                <a href="{{ .Page.RelPermalink }}" aria-label="{{ .Page.LinkTitle }}, {{ .Count }} {{ cond (eq .Count 1) "post" "posts" }}">{{ .Page.LinkTitle }}<span class="term-count" aria-hidden="true">{{ .Count }}</span></a>
            </li>
            {{ end }}
        </ul>
    </section>
</div>
{{ partial "ga.html" }}
</body>
</html>
